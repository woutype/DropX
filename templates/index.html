{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <title>DropX-Registration</title>
</head>
<body>
    <div class="icon">
        <h1 class="logo-text">Drop</h1>
        <img src="{% static 'icons/icon.svg' %}" alt="X" class="logo-icon">
    </div>
    <p>Чай, печенье, сладкий Twix — всё, что есть, неси в DropX!</p>

    <div class="auth-container">
        <input type="text" id="nick" class="custom-input" placeholder="Введите имя" aria-label="Nickname">
        <input type="password" id="pass" class="custom-input pass-hidden" placeholder="Введите пароль" aria-label="Password">
        <button type="button" class="continue-btn" aria-label="Continue">
            <span>Продолжить</span>
        </button>
    </div>


    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
